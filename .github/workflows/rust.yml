name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Browser WASM target: no OS or host-system imports.
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --lib --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: wasm-bindgen --target web --out-dir web/pkg target/wasm32-unknown-unknown/release/raytracer.wasm
      - run: node scripts/check-wasm.mjs
      - run: node --test tests/*.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: raytracer-mini-app
          path: web/
          if-no-files-found: error
  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: raytracer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - name: Start container
        run: >-
          docker run -d --name raytracer-ci --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL
          --security-opt no-new-privileges:true
          -p 127.0.0.1:8000:8080 raytracer:ci
      - run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:8000/healthz
      - run: node scripts/check-http.mjs
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: review-output/
          if-no-files-found: ignore
      - name: Container logs
        if: failure()
        run: docker logs raytracer-ci
      - name: Stop container
        if: always()
        run: docker rm -f raytracer-ci
